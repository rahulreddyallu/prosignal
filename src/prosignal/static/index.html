<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Prosignal — Equity Research Terminal</title>
<style>
/* ============================================================================
   DESIGN SYSTEM
   One place for every primitive. Components below compose these and never
   introduce their own colours, radii or shadows.
   ========================================================================= */
:root{
  /* surface — warm neutrals rather than pure grey; pure #fff/#000 reads clinical */
  --bg:#FAFAF9; --surface:#FFFFFF; --surface-2:#F5F5F4; --surface-sunken:#FAFAF9;
  --border:#E7E5E4; --border-strong:#D6D3D1;

  /* ink -- four steps is enough; more invites inconsistency.
     Every step clears WCAG AA (4.5:1) on --surface. The lightest step carries
     column headers, company names and eyebrow labels: the text that tells you
     WHICH number you are reading. It was #A8A29E at 2.52:1, which is a real
     legibility failure in a product made of small numbers, not a checkbox. */
  --ink:#1C1917; --ink-2:#44403C; --ink-3:#5F5955; --ink-4:#7C756F;

  /* one accent, used only for primary action and active state */
  --accent:#4338CA; --accent-hover:#3730A3; --accent-soft:#EEF2FF; --accent-ink:#3730A3;

  /* market semantics ONLY. Muted deliberately — saturated green/red on a light
     ground reads as an alert, and most of this screen is not an alert. */
  --up:#047857; --up-soft:#ECFDF5;
  --down:#B91C1C; --down-soft:#FEF2F2;
  --warn:#B45309; --warn-soft:#FFFBEB;

  /* 8px scale */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px;
  --r-sm:6px; --r:10px; --r-lg:14px;

  /* shadows: barely present. Elevation comes from border + ground contrast. */
  --sh-1:0 1px 2px rgba(28,25,23,.04), 0 1px 1px rgba(28,25,23,.03);
  --sh-2:0 4px 12px rgba(28,25,23,.06), 0 1px 3px rgba(28,25,23,.04);
  --ring:0 0 0 3px rgba(67,56,202,.14);

  --font:-apple-system,BlinkMacSystemFont,"Inter","SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  --t:160ms cubic-bezier(.4,0,.2,1);
  --maxw:1180px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0C0A09; --surface:#1C1917; --surface-2:#292524; --surface-sunken:#171412;
    --border:#292524; --border-strong:#44403C;
    /* same rule inverted: the lightest step must still clear 4.5:1 on the dark
       surface, where #78716C only reached 3.57:1. */
    --ink:#FAFAF9; --ink-2:#D6D3D1; --ink-3:#B0A9A3; --ink-4:#928B85;
    --accent:#818CF8; --accent-hover:#A5B4FC; --accent-soft:#1E1B4B; --accent-ink:#C7D2FE;
    --up:#34D399; --up-soft:#052E23; --down:#F87171; --down-soft:#3B0A0A;
    --warn:#FBBF24; --warn-soft:#3A2A05;
    --sh-1:none; --sh-2:0 4px 16px rgba(0,0,0,.4);
  }
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  font-size:14px;line-height:1.5;letter-spacing:-.006em;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

/* ---- app shell --------------------------------------------------------- */
.hdr{
  position:sticky;top:0;z-index:50;background:rgba(250,250,249,.82);
  backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--border);
}
@media (prefers-color-scheme:dark){.hdr{background:rgba(12,10,9,.82)}}
.hdr-in{max-width:var(--maxw);margin:0 auto;padding:0 var(--s5);height:56px;
  display:flex;align-items:center;gap:var(--s4)}
.brand{display:flex;align-items:baseline;gap:var(--s2);margin-right:auto;min-width:0}
.brand b{font-size:14px;font-weight:600;letter-spacing:-.02em}
.brand span{font-size:11px;color:var(--ink-4);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
main{max-width:var(--maxw);margin:0 auto;padding:var(--s5) var(--s5) var(--s8)}

/* ---- primitives -------------------------------------------------------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  box-shadow:var(--sh-1)}
.card-p{padding:var(--s5)}
.stack{display:flex;flex-direction:column;gap:var(--s4)}
.row{display:flex;align-items:center;gap:var(--s3)}
.spread{display:flex;align-items:center;justify-content:space-between;gap:var(--s3)}

.eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-4)}
h1{font-size:19px;font-weight:600;letter-spacing:-.02em;margin:0}
h2{font-size:13px;font-weight:600;letter-spacing:-.01em;margin:0;color:var(--ink)}
.muted{color:var(--ink-3)}
.tiny{font-size:11.5px;line-height:1.55}
.mono{font-family:var(--mono);font-size:11px}

button{font:inherit;cursor:pointer;border-radius:var(--r-sm);border:1px solid transparent;
  transition:background var(--t),border-color var(--t),color var(--t),box-shadow var(--t);
  white-space:nowrap}
button:focus-visible{outline:none;box-shadow:var(--ring)}
button:disabled{opacity:.45;cursor:not-allowed}
.btn{background:var(--accent);color:#fff;padding:8px 16px;font-size:13px;font-weight:550}
.btn:hover:not(:disabled){background:var(--accent-hover)}
.btn-ghost{background:transparent;color:var(--ink-2);border-color:var(--border-strong);
  padding:7px 13px;font-size:12.5px}
.btn-ghost:hover:not(:disabled){background:var(--surface-2);color:var(--ink)}
.btn-warn{background:var(--warn);color:#fff;padding:8px 16px;font-size:13px;font-weight:550}
.btn-warn:hover:not(:disabled){filter:brightness(.94)}

.tag{display:inline-flex;align-items:center;gap:5px;height:21px;padding:0 8px;
  border-radius:5px;font-size:11px;font-weight:550;letter-spacing:-.005em;
  border:1px solid transparent;white-space:nowrap}
.tag-buy{background:var(--up-soft);color:var(--up)}
.tag-watch{background:var(--warn-soft);color:var(--warn)}
.tag-none{background:var(--surface-2);color:var(--ink-3);border-color:var(--border)}
.tag-live{background:var(--up-soft);color:var(--up)}
.dot{width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}

/* ---- header status ----------------------------------------------------- */
.status{display:flex;align-items:center;gap:var(--s3);font-size:11.5px;
  color:var(--ink-3);white-space:nowrap;flex:none}
.status .sep{width:1px;height:14px;background:var(--border)}
/* 860px, not 720: when the store is empty a second button appears in the
   header, and at 768px the date and session count were wrapping onto two
   lines each. Shed the metadata before the header can break. */
@media (max-width:860px){.status .hide-sm{display:none}}
/* Only the empty-store case puts two buttons in the header, and only then does
   the readiness pill stop fitting on a phone. Shed it in that case alone --
   the not-ready card below states the same thing at full length. */
@media (max-width:560px){body.needs-build .status{display:none}}
@media (max-width:560px){.brand span{display:none}}

/* ---- market context strip --------------------------------------------- */
.ctx{display:grid;grid-template-columns:repeat(auto-fit,minmax(126px,1fr));
  border:1px solid var(--border);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.ctx>div{padding:var(--s3) var(--s4);border-right:1px solid var(--border)}
.ctx>div:last-child{border-right:none}
.ctx dt{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-4);margin:0 0 3px}
.ctx dd{margin:0;font-size:13.5px;font-weight:550;letter-spacing:-.01em}
.ctx dd small{font-weight:450;color:var(--ink-3);font-size:11.5px}
@media (max-width:640px){.ctx>div{border-right:none;border-bottom:1px solid var(--border)}
  .ctx>div:last-child{border-bottom:none}}

/* ---- headline decision ------------------------------------------------- */
.verdict{display:flex;align-items:flex-start;gap:var(--s5);flex-wrap:wrap}
.verdict-main{flex:1 1 300px;min-width:0}
.verdict h1{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap}
.verdict-n{font-size:30px;font-weight:600;letter-spacing:-.03em;line-height:1.1}

/* ---- funnel ------------------------------------------------------------ */
.funnel{display:flex;flex-direction:column;gap:7px}
.fn{display:grid;grid-template-columns:132px 1fr 46px;align-items:center;gap:var(--s3)}
.fn-l{font-size:11.5px;color:var(--ink-3);text-align:right;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fn-bar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.fn-bar i{display:block;height:100%;background:var(--accent);opacity:.82;border-radius:3px;
  transform-origin:left;animation:grow 420ms cubic-bezier(.4,0,.2,1) both}
.fn-bar.zero i{background:var(--ink-4);opacity:.35}
.fn-v{font-size:12px;font-weight:600;text-align:right}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (max-width:560px){.fn{grid-template-columns:104px 1fr 40px}}
@media (min-width:1024px){.tw{overflow:visible}thead th{top:56px}}


/* ---- scanner table ----------------------------------------------------- */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 calc(var(--s5) * -1);
  padding:0 var(--s5)}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:760px}
/* top:0 not 56px -- overflow-x:auto forces overflow-y:auto, which makes .tw a
   scroll container, so a 56px offset lands the header on top of row 1. The
   viewport-relative sticky header is restored at >=1024px where the table fits
   and .tw no longer needs to scroll. */
thead th{position:sticky;top:0;z-index:5;background:var(--surface);
  text-align:left;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-4);padding:8px 12px;border-bottom:1px solid var(--border);white-space:nowrap;
  user-select:none}
thead th.s{cursor:pointer}
thead th.s:hover{color:var(--ink-2)}
thead th.r,td.r{text-align:right}
thead th .car{opacity:.45;font-size:9px;margin-left:3px}
tbody tr{transition:background var(--t)}
tbody tr.main{cursor:pointer}
tbody tr.main:hover{background:var(--surface-2)}
/* A background tint alone was a ~1.05:1 focus indicator -- effectively
   invisible. WCAG 2.2 wants 3:1 against adjacent colour, so pair the tint with
   a real outline drawn inside the row's own bounds. */
tbody tr.main:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;
  background:var(--accent-soft)}
tbody td{padding:11px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr.open td{border-bottom-color:transparent;background:var(--surface-2)}
.tk{font-weight:600;letter-spacing:-.01em}
.co{font-size:11px;color:var(--ink-4);margin-top:1px;
  max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{display:inline-block;transition:transform var(--t);color:var(--ink-4);font-size:10px}
tr.open .chev{transform:rotate(90deg)}

/* score meter — restrained, not a rainbow */
.meter{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.meter-t{width:44px;height:4px;background:var(--surface-2);border-radius:2px;overflow:hidden;flex:none}
.meter-t i{display:block;height:100%;background:var(--accent);opacity:.8;border-radius:2px}
.meter b{font-weight:600;min-width:26px;text-align:right}

/* expandable detail */
tr.detail>td{padding:0;border-bottom:1px solid var(--border);background:var(--surface-2)}
.det{padding:var(--s4) var(--s5) var(--s5);display:grid;
  grid-template-columns:repeat(auto-fit,minmax(258px,1fr));gap:var(--s5)}
/* balanced 2x2 rather than a ragged 3+1 -- and the wider column gives the
   research citations room to set on two lines instead of four */
@media (min-width:900px){.det{grid-template-columns:1fr 1fr}}
.det section{min-width:0}
.det h3{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-4);margin:0 0 var(--s2)}
.det ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.det li{font-size:11.5px;line-height:1.5;color:var(--ink-2);padding-left:15px;position:relative}
.det li::before{position:absolute;left:0;top:0;font-size:10px}
.ev-for li::before{content:"✓";color:var(--up)}
.ev-against li::before{content:"!";color:var(--warn);font-weight:700}
.ev-unknown li::before{content:"?";color:var(--ink-4)}
.ev-exit li::before{content:"→";color:var(--ink-4)}

/* trade levels */
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:1px;
  background:var(--border);border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden}
.levels div{background:var(--surface);padding:9px 11px}
.levels dt{font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ink-4);margin:0 0 2px}
.levels dd{margin:0;font-size:13px;font-weight:600;letter-spacing:-.01em}
.levels dd.pos{color:var(--up)} .levels dd.neg{color:var(--down)}

/* Mobile: drop the table's horizontal scroll entirely rather than making the
   user swipe sideways. The expandable row already carries stop, target, R:R
   and every factor, so hiding those columns loses nothing -- and it keeps the
   evidence prose, which lives inside this same scroll container, readable
   without horizontal scrolling. */
/* Tablet tier. Between 761px and 1023px all ten columns force the table into
   horizontal scroll, which drags the evidence panel into a scroll container
   with it. Dropping rank (implicit in sort order) and the two factor columns
   lets the table fit; both factors remain in the expanded panel. */
@media (max-width:1023px){
  table{min-width:0}
  .c-score{display:none}
  /* auto-fit's intrinsic minimum inside a table cell is (tracks x min track),
     so the 8-cell levels grid silently widens the whole table. Pin the count. */
  .levels{grid-template-columns:repeat(4,1fr)}
  tbody td,thead th{padding-left:8px;padding-right:8px}
}

@media (max-width:760px){
  /* Make the table genuinely FIT rather than scroll. Everything hidden here
     -- rank, price, stop, target, R:R and the factor columns -- is present in
     full inside the expandable panel one tap away, where it sits next to the
     entry and invalidation levels it belongs with. A scanner on a phone
     answers "which names, how strong"; the numbers follow on the tap.
     Fitting also means the evidence prose renders at natural width instead of
     inside a sideways-scrolling container. */
  table{min-width:0}
  .c-score,.c-last_close,.c-stop,.c-target_1{display:none}
  tbody td,thead th{padding-left:8px;padding-right:8px}
  .co{max-width:90px}
  .meter-t{display:none}
  .det{padding:var(--s4) var(--s3) var(--s4);grid-template-columns:1fr}
  .levels{grid-template-columns:1fr 1fr}
}

/* Small phones (320-360px: iPhone SE, older Android). Four pixels of overflow
   here is enough to put the whole table into horizontal scroll and drag the
   evidence prose with it, so trim the company name and the badge. 375px and up
   keep the roomier treatment. */
@media (max-width:360px){
  .co{max-width:64px}
  .tag{font-size:10px;padding:0 6px;height:20px}
  tbody td,thead th{padding-left:6px;padding-right:6px}
}

/* ---- states ------------------------------------------------------------ */
.state{text-align:center;padding:var(--s7) var(--s5)}
.state h2{font-size:15px;margin-bottom:var(--s2)}
.state p{margin:0 auto;max-width:440px;color:var(--ink-3);font-size:12.5px;line-height:1.6}
.state .glyph{width:38px;height:38px;margin:0 auto var(--s4);border-radius:10px;
  background:var(--surface-2);border:1px solid var(--border);
  display:grid;place-items:center;color:var(--ink-4);font-size:16px}

.err{border-color:color-mix(in srgb,var(--down) 32%,var(--border))}
.err .glyph{background:var(--down-soft);border-color:transparent;color:var(--down)}

/* progress */
.prog{display:flex;flex-direction:column;gap:var(--s2)}
.prog-track{height:3px;background:var(--surface-2);border-radius:2px;overflow:hidden}
.prog-track i{display:block;height:100%;background:var(--accent);border-radius:2px;
  transition:width 320ms cubic-bezier(.4,0,.2,1)}
.steps{list-style:none;margin:var(--s3) 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.steps li{font-size:12px;color:var(--ink-4);display:flex;align-items:center;gap:8px;
  transition:color var(--t)}
.steps li.done{color:var(--ink-3)} .steps li.now{color:var(--ink);font-weight:550}
.steps .mk{width:13px;text-align:center;font-size:10px;flex:none}
.steps li.done .mk{color:var(--up)}

/* skeleton */
.sk{background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface) 50%,var(--surface-2) 75%);
  background-size:200% 100%;animation:sh 1.4s ease-in-out infinite;border-radius:5px;height:11px}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* disclosure */
details{border-top:1px solid var(--border);padding-top:var(--s3);margin-top:var(--s3)}
summary{cursor:pointer;font-size:11.5px;color:var(--ink-3);list-style:none;
  display:flex;align-items:center;gap:6px;user-select:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"›";display:inline-block;transition:transform var(--t);
  color:var(--ink-4);font-size:13px}
details[open] summary::before{transform:rotate(90deg)}
summary:hover{color:var(--ink-2)}
summary:focus-visible{outline:none;box-shadow:var(--ring);border-radius:var(--r-sm)}
details .body{padding-top:var(--s3)}

.foot{margin-top:var(--s6);padding-top:var(--s4);border-top:1px solid var(--border);
  display:flex;flex-wrap:wrap;gap:var(--s2) var(--s4);align-items:center;
  font-size:11px;color:var(--ink-4)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
.hide{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-in">
    <div class="brand">
      <b>Prosignal</b>
      <span>NSE equities · end-of-day research</span>
    </div>
    <div class="status" id="status"></div>
    <button class="btn" id="run">Run analysis</button>
    <button class="btn-warn hide" id="build">Build data store</button>
  </div>
</header>

<main id="app">
  <div class="stack" id="boot">
    <div class="ctx" id="ctxSkel">
      <div><dt>Regime</dt><dd><div class="sk" style="width:70%"></div></dd></div>
      <div><dt>Trend</dt><dd><div class="sk" style="width:56%"></div></dd></div>
      <div><dt>Volatility</dt><dd><div class="sk" style="width:64%"></div></dd></div>
      <div><dt>Breadth</dt><dd><div class="sk" style="width:48%"></div></dd></div>
    </div>
    <div class="card card-p"><div class="sk" style="width:180px;height:24px"></div>
      <div class="sk" style="width:70%;margin-top:14px"></div></div>
  </div>
</main>

<script>
"use strict";
const STEPS=["Loading market data","Validating data quality","Assessing market regime",
 "Screening eligibility","Scoring the universe","Running false-signal defense",
 "Checking entry triggers","Building risk plans","Applying decision gates"];

const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const n=document.createElement(t);if(c)n.className=c;
  if(h!==undefined)n.innerHTML=h;return n};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* formatting — one definition each, used everywhere */
const inr=v=>v==null?"—":"₹"+Number(v).toLocaleString("en-IN",
  {minimumFractionDigits:2,maximumFractionDigits:2});
const pct=(v,d=1)=>v==null?"—":(v>0?"+":"")+Number(v).toFixed(d)+"%";
const pctPlain=(v,d=0)=>v==null?"—":Number(v).toFixed(d)+"%";
const clock=iso=>{try{return new Date(iso).toLocaleTimeString("en-IN",
  {hour:"numeric",minute:"2-digit",hour12:true})}catch(e){return"—"}};
const ago=iso=>{try{const m=Math.round((Date.now()-new Date(iso))/60000);
  if(m<1)return"just now";if(m<60)return m+" min ago";
  const h=Math.round(m/60);return h<24?h+" hr ago":Math.round(h/24)+" d ago"}catch(e){return""}};

let poll=null, DATA=null, sortKey="model_rank", sortAsc=true, openRow=null;
/* BUSY guards against a race: boot() is async, so a user who clicks Run before
   /ready resolves would otherwise have the progress view overwritten by the
   idle screen when the readiness fetch lands. */
let BUSY=false;

/* ---------- readiness ---------------------------------------------------- */
async function boot(){
  let d;
  try{ d=await (await fetch("/ready")).json(); }
  catch(e){ return fail("Cannot reach the analysis service.",
    "The backend is not responding. Check that the server process is running."); }
  const c=d.checks||{};
  $("#status").innerHTML =
    `<span class="tag ${d.ready?"tag-live":"tag-none"}"><i class="dot"></i>${d.ready?"Ready":"Not ready"}</span>`+
    `<span class="sep hide-sm"></span>`+
    `<span class="hide-sm num">${esc(c.latest_session||"—")}</span>`+
    `<span class="sep hide-sm"></span>`+
    `<span class="hide-sm num">${esc(c.price_sessions??"—")} sessions</span>`;
  $("#run").disabled=!d.ready;
  $("#build").classList.toggle("hide",!!d.ready);
  document.body.classList.toggle("needs-build",!d.ready);
  if(BUSY) return;
  if(!d.ready) notReady(c);
  else if(!DATA) idle(c);
}

function notReady(c){
  $("#app").innerHTML="";
  const card=el("div","card state");
  card.innerHTML=`<div class="glyph">◴</div>
    <h2>Market data store is empty</h2>
    <p>${esc(c.price_data||"")}</p>
    <p style="margin-top:12px">${esc(c.remedy||"")}</p>`;
  $("#app").append(card);
}

function idle(c){
  $("#app").innerHTML="";
  const card=el("div","card state");
  card.innerHTML=`<div class="glyph">↳</div>
    <h2>Ready to analyse</h2>
    <p>${esc(c.price_sessions??0)} sessions held · ${esc(c.analysable_dates??0)} analysable dates ·
       ${esc(c.universe||"")}. Run an analysis to evaluate today's universe.</p>`;
  $("#app").append(card);
}

/* ---------- run ---------------------------------------------------------- */
$("#run").onclick=async()=>{
  BUSY=true; $("#run").disabled=true; DATA=null; openRow=null; showProgress(0,"Starting");
  try{
    const res=await fetch("/analysis/run",{method:"POST"});
    const j=await res.json();
    if(!j.id) throw new Error(j.detail||j.message||"The service did not return a run id.");
    watch(j.id,false);
  }catch(e){ reset();
    fail("Could not start the analysis.",e.message||String(e)); }
};
$("#build").onclick=async()=>{
  BUSY=true; $("#build").disabled=true; $("#run").disabled=true;
  showProgress(0,"Fetching from NSE — keep this tab open");
  try{
    const res=await fetch("/admin/bootstrap",{method:"POST"});
    const j=await res.json();
    if(!j.id) throw new Error(j.detail||j.message||"The service did not return a job id.");
    watch(j.id,true);
  }catch(e){ reset();
    fail("Could not start the data build.",e.message||String(e)); }
};

function showProgress(step,label,build){
  $("#app").innerHTML="";
  const card=el("div","card card-p");
  const pctv=Math.round(100*step/STEPS.length);
  card.innerHTML=`<div class="spread" style="margin-bottom:14px">
      <h2>${build?"Building data store":"Analysis running"}</h2>
      <span class="tiny muted num" id="ppct">${build?"":pctv+"%"}</span></div>
    <div class="prog"><div class="prog-track"><i id="pfill" style="width:${build?12:pctv}%"></i></div></div>
    <ul class="steps" id="psteps"></ul>`;
  $("#app").append(card);
  drawSteps(step,label,build);
}
function drawSteps(step,label,build){
  const ul=$("#psteps"); if(!ul)return;
  if(build){ ul.innerHTML=`<li class="now"><span class="mk">▸</span>${esc(label)}</li>`; return; }
  ul.innerHTML=STEPS.map((s,i)=>{
    const cls=i<step?"done":(i===step?"now":"");
    const mk=i<step?"✓":(i===step?"▸":"·");
    return `<li class="${cls}"><span class="mk">${mk}</span>${esc(s)}</li>`;
  }).join("");
}

function watch(id,build){
  clearInterval(poll);
  poll=setInterval(async()=>{
    let j;
    try{ j=await (await fetch(`/analysis/${id}`)).json(); }
    catch(e){ clearInterval(poll); reset();
      return fail("Lost contact with the analysis service.",String(e),id); }
    const st=j.progress.step;
    const w=build?Math.max(j.progress.pct,12):Math.round(100*st/STEPS.length);
    const f=$("#pfill"); if(f) f.style.width=w+"%";
    const lab=$("#ppct"); if(lab&&!build) lab.textContent=w+"%";
    drawSteps(st,j.progress.label,build);
    if(j.state==="COMPLETED"){ clearInterval(poll); reset();
      build?afterBuild(j):load(id); }
    else if(j.state==="FAILED"||j.state==="CANCELLED"){ clearInterval(poll); reset();
      fail(j.state==="CANCELLED"?"Analysis cancelled.":"Analysis could not complete.",
           j.error,id); }
  },700);
}
function reset(){ BUSY=false; $("#run").disabled=false; $("#build").disabled=false; }

function afterBuild(j){
  const r=j.result||{};
  $("#app").innerHTML="";
  const card=el("div","card state");
  card.innerHTML=`<div class="glyph">${r.complete?"✓":"◴"}</div>
    <h2>${r.complete?"Data store ready":"Chunk complete"}</h2>
    <p class="num">${esc(r.sessions_in_store??0)} of ${esc(r.sessions_required??0)} sessions.
       ${esc(r.next_step||"")}</p>`;
  if(!r.complete){
    const b=el("button","btn"); b.textContent="Fetch next chunk"; b.style.marginTop="18px";
    b.onclick=()=>$("#build").click(); card.append(b);
  }
  $("#app").append(card); boot();
}

function fail(title,detail,id){
  $("#app").innerHTML="";
  const card=el("div","card state err");
  card.innerHTML=`<div class="glyph">!</div><h2>${esc(title)}</h2>
    <p>${esc(detail||"")}</p>
    <p style="margin-top:12px"><strong>No signals were issued.</strong>
       A partial or failed analysis never produces a trade recommendation.</p>
    ${id?`<p class="mono muted" style="margin-top:12px">Run ${esc(id)}</p>`:""}`;
  $("#app").append(card);
}

/* ---------- results ------------------------------------------------------ */
async function load(id){
  try{ DATA=await (await fetch(`/analysis/${id}/results`)).json(); }
  catch(e){ return fail("Results could not be loaded.",String(e),id); }
  render();
}

function render(){
  const d=DATA, r=d.regime, f=d.funnel||{};
  const buys=d.recommendations||[], watch=d.watchlist||[];
  const app=$("#app"); app.innerHTML="";
  const wrap=el("div","stack");

  /* market context */
  const ctx=el("div","ctx");
  ctx.innerHTML=`
    <div><dt>Regime</dt><dd>${esc(r.bucket)}</dd></div>
    <div><dt>Trend</dt><dd>${esc(r.trend)}</dd></div>
    <div><dt>Volatility</dt><dd>${esc(r.volatility)}</dd></div>
    <div><dt>Breadth</dt><dd class="num">${r.breadth_pct==null?"—":pctPlain(r.breadth_pct)}
       <small>${esc(r.breadth_state||"")}</small></dd></div>
    <div><dt>New entries</dt><dd>${r.allow_new_entries?"Allowed":"Blocked"}</dd></div>`;
  wrap.append(ctx);

  /* verdict */
  const v=el("div","card card-p");
  const hasSignals=buys.length>0;
  v.innerHTML=`<div class="verdict">
      <div class="verdict-main">
        <div class="eyebrow">Decision · ${esc(d.as_of_date)}</div>
        <div class="verdict-n" style="margin-top:6px">${
          hasSignals?`${buys.length} buy candidate${buys.length>1?"s":""}`:"No trade"}</div>
        <p class="tiny muted" style="margin:8px 0 0;max-width:520px">${
          hasSignals
            ? `${watch.length} additional name${watch.length===1?"":"s"} on the watchlist.`
            : esc((d.no_trade&&d.no_trade.reason)||"")}</p>
      </div>
      <div style="flex:1 1 300px;max-width:380px">
        <div class="eyebrow" style="margin-bottom:8px">Universe funnel</div>
        <div class="funnel" id="fn"></div>
      </div>
    </div>`;
  wrap.append(v);
  app.append(wrap);

  /* funnel bars */
  const top=Math.max(...Object.values(f).map(Number),1);
  const LBL={universe_considered:"Universe",passed_eligibility:"Eligible",
    survived_defense:"Survived defense",triggered:"Entry triggered",
    passed_portfolio_limits:"Final signals"};
  const fn=$("#fn");
  Object.entries(LBL).forEach(([k,label],i)=>{
    if(f[k]===undefined)return;
    const n=Number(f[k]);
    const row=el("div","fn");
    row.innerHTML=`<div class="fn-l">${label}</div>
      <div class="fn-bar ${n===0?"zero":""}"><i style="width:${Math.max(n/top*100,1.5)}%;
        animation-delay:${i*45}ms"></i></div>
      <div class="fn-v num">${n}</div>`;
    fn.append(row);
  });

  /* signals */
  const all=[...buys,...watch];
  if(all.length) wrap.append(scanner(all));
  else wrap.append(noTrade(d));

  /* footnote */
  const foot=el("div","foot");
  foot.innerHTML=`<span>Analysed ${clock(d.generated_at)} · ${ago(d.generated_at)}</span>
    <span>·</span><span class="mono">${esc(d.run_id)}</span>
    <span>·</span><span class="mono">${esc(d.config_version||"")}</span>`;
  wrap.append(foot);

  const note=el("details");
  note.innerHTML=`<summary>Methodology and limitations</summary>
    <div class="body stack" style="gap:10px">
      <p class="tiny muted" style="margin:0">${esc(d.probability_note||"")}</p>
      <p class="tiny muted" style="margin:0">${esc(d.disclaimer||"")}</p>
      ${(d.data_quality_flags||[]).map(x=>
        `<p class="tiny muted" style="margin:0">Data quality — ${esc(x)}</p>`).join("")}
    </div>`;
  wrap.append(note);
}

/* ---------- no-trade state ---------------------------------------------- */
function noTrade(d){
  const nt=d.no_trade||{}, f=d.funnel||{};
  const card=el("div","card");
  card.innerHTML=`<div class="state" style="padding:var(--s6) var(--s5) var(--s5)">
      <div class="glyph">◇</div>
      <h2>No qualifying signals today</h2>
      <p class="num">${f.universe_considered??0} analysed ·
         ${f.passed_eligibility??0} eligible ·
         ${f.survived_defense??0} survived defense ·
         0 met every gate</p>
      <p style="margin-top:10px">This is expected behaviour. The strategy issues a
         signal only when every gate is satisfied, and returns no trade on most days
         by design.</p>
    </div>`;
  if((nt.closest||[]).length){
    const t=el("div","tw"); t.style.marginTop="var(--s2)";
    t.innerHTML=`<table><thead><tr>
        <th style="width:34px">#</th><th>Closest candidate</th>
        <th class="r">Score</th><th>Stopped at</th></tr></thead>
      <tbody>${nt.closest.map(c=>`<tr>
        <td class="num muted">${c.rank}</td>
        <td class="tk">${esc(c.ticker)}</td>
        <td class="r num">${(c.score*100).toFixed(0)}</td>
        <td class="muted">${esc(c.gate_failed)}</td></tr>`).join("")}</tbody></table>`;
    card.append(t);
  }
  return card;
}

/* ---------- scanner ------------------------------------------------------ */
/* Columns show what the decision actually used.
   `model_rank` is the position the model put the name in, and it is what
   Stage 6 admits on: inside entry_rank a name is bought, outside exit_rank a
   held name is dropped. The old `#` was the display position after Stage 5
   penalties re-sorted the table, so the BUYs appeared scattered through rows
   ordered by a different quantity -- rank 1 sitting eighth.

   Three columns were removed rather than repaired:
     R:R      target_1 is entry + t1_r_multiple x risk, so this was 1.50 on
              every one of 52 cards. A column with one distinct value is not
              information.
     Mom      looked up "momentum_12_1"
     Value    looked up "value"
              Both are hand-composite factor names the fitted model replaced.
              Present in 0 of 52 cards, so both rendered as a dash always.

   The model's own attribution is on the expanded card, which names the six
   factors carrying the movement and their coefficients. */
const COLS=[
  {k:"model_rank",t:"Rank", r:true,  v:c=>c.model_rank},
  {k:"ticker",t:"Stock",    r:false, v:c=>c.ticker},
  {k:"decision",t:"Signal", r:false, v:c=>c.decision},
  {k:"score", t:"Score",    r:true,  v:c=>c.score},
  {k:"last_close",t:"Price",r:true,  v:c=>c.last_close},
  {k:"stop",  t:"Stop",     r:true,  v:c=>c.stop},
  {k:"target_1",t:"Target", r:true,  v:c=>c.target_1},
];

function scanner(rows){
  const card=el("div","card card-p");
  /* The BUY / WATCHLIST split confused every reader of the old table, because
     the rows were numbered by post-penalty position while admission ran on
     model rank. Both are shown now, and the rule is stated rather than left to
     be inferred from which rows happen to be green. */
  const nb=rows.filter(r=>/BUY/i.test(r.decision||"")).length;
  card.innerHTML=`<div class="spread" style="margin-bottom:var(--s3)">
      <h2>Signals</h2>
      <span class="tiny muted">${rows.length} name${rows.length===1?"":"s"} · tap a row for evidence</span>
    </div>
    <p class="tiny muted" style="margin:0 0 var(--s4);max-width:78ch;line-height:1.5">
      <b>${nb} buy</b> · the model's top ${nb} by <b>Rank</b>, which is the only
      thing admission uses. The rest are <b>watchlist</b>: they cleared scoring
      and the false-signal defence but sit outside the entry band, so they are
      ranked evidence rather than positions. <b>Score</b> is a percentile within
      today's eligible universe <i>after</i> Stage&nbsp;5 penalties, so a
      penalised name can show a lower score than one the model ranked below it
      — sort by Rank to see the model's own ordering.
    </p>`;
  const tw=el("div","tw"); const tbl=el("table");
  tbl.innerHTML=`<thead><tr>${COLS.map(c=>
    `<th class="s c-${c.k} ${c.r?"r":""}" data-k="${c.k}">${c.t}<span class="car" data-car="${c.k}"></span></th>`
  ).join("")}</tr></thead><tbody></tbody>`;
  tw.append(tbl); card.append(tw);
  paint(tbl,rows);
  tbl.querySelectorAll("th.s").forEach(th=>{
    th.onclick=()=>{const k=th.dataset.k;
      if(sortKey===k) sortAsc=!sortAsc; else{sortKey=k;sortAsc=(k==="model_rank"||k==="ticker")}
      openRow=null; paint(tbl,rows)};
  });
  return card;
}

function paint(tbl,rows){
  const col=COLS.find(c=>c.k===sortKey)||COLS[0];
  const sorted=[...rows].sort((a,b)=>{
    let x=col.v(a),y=col.v(b);
    if(x==null&&y==null)return 0; if(x==null)return 1; if(y==null)return -1;
    if(typeof x==="string")return sortAsc?x.localeCompare(y):y.localeCompare(x);
    return sortAsc?x-y:y-x;
  });
  tbl.querySelectorAll("[data-car]").forEach(s=>
    s.textContent = s.dataset.car===sortKey ? (sortAsc?"▲":"▼") : "");

  const tb=tbl.querySelector("tbody"); tb.innerHTML="";
  sorted.forEach(c=>{
    const buy=/BUY/i.test(c.decision);
    const tr=el("tr","main"); tr.tabIndex=0;
    tr.innerHTML=`
      <td class="c-model_rank r num muted">${c.model_rank}</td>
      <td class="c-ticker"><div class="row" style="gap:7px"><span class="chev">›</span>
        <div style="min-width:0"><div class="tk">${esc(c.ticker)}</div>
        <div class="co">${esc(c.company_name||c.sector||"")}</div></div></div></td>
      <td class="c-decision"><span class="tag ${buy?"tag-buy":"tag-watch"}">${esc(c.decision)}</span></td>
      <td class="c-score r"><div class="meter">
        <span class="meter-t"><i style="width:${Math.round(c.score*100)}%"></i></span>
        <b class="num">${Math.round(c.score*100)}</b></div></td>
      <td class="c-last_close r num">${inr(c.last_close)}</td>
      <td class="c-stop r num muted">${inr(c.stop)}</td>
      <td class="c-target_1 r num">${inr(c.target_1)}</td>`;
    /* The evidence panel is built on first expand, not upfront. Building all
       of them eagerly cost ~75 DOM nodes per row -- 15k nodes for a 200-name
       list -- for markup the user may never open. */
    const det=el("tr","detail hide");
    det.innerHTML=`<td colspan="${COLS.length}"></td>`;
    const toggle=()=>{
      const isOpen=!det.classList.contains("hide");
      tb.querySelectorAll("tr.detail").forEach(x=>x.classList.add("hide"));
      tb.querySelectorAll("tr.main").forEach(x=>x.classList.remove("open"));
      if(!isOpen){
        if(!det.dataset.built){ det.firstChild.innerHTML=detail(c); det.dataset.built="1"; }
        det.classList.remove("hide"); tr.classList.add("open");
      }
    };
    tr.onclick=toggle;
    tr.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();toggle()}};
    tb.append(tr,det);
  });
}

function detail(c){
  const lv=`<div class="levels">
    <div><dt>Last close</dt><dd class="num">${inr(c.last_close)}</dd></div>
    <div><dt>Entry</dt><dd class="num">${c.entry_zone
      ?inr(c.entry_zone[0])+" – "+inr(c.entry_zone[1]):"No trigger"}</dd></div>
    <div><dt>Stop</dt><dd class="num neg">${inr(c.stop)}</dd></div>
    <div><dt>Target 1</dt><dd class="num pos">${inr(c.target_1)}</dd></div>
    <div><dt>Target 2</dt><dd class="num pos">${inr(c.target_2)}</dd></div>
    <div><dt>Invalidation</dt><dd class="num">${inr(c.invalidation)}</dd></div>
    <div><dt>Risk</dt><dd>${esc(c.risk_category||"—")}</dd></div>
    <div><dt>Hold</dt><dd style="font-size:12px">${esc(c.holding_period||"—")}</dd></div>
  </div>`;
  const list=(cls,items)=>items&&items.length
    ? `<ul class="${cls}">${items.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`
    : `<p class="tiny muted" style="margin:0">None</p>`;
  return `<div class="det">
    <section style="grid-column:1/-1">${lv}
      ${c.cost_note?`<p class="tiny muted" style="margin:10px 0 0">${esc(c.cost_note)}</p>`:""}
    </section>
    <section><h3>Why this signal exists</h3>${list("ev-for",c.why)}</section>
    <section><h3>Why it may be wrong</h3>${list("ev-against",
      (c.against&&c.against.length)?c.against
        :["No disconfirming evidence among the checks that could run. That is not the same as no risk."])}</section>
    <section><h3>Not testable with current data</h3>${list("ev-unknown",c.not_testable)}</section>
    <section><h3>Exit hierarchy</h3>${list("ev-exit",(c.exits||[]).slice(0,4))}</section>
  </div>`;
}

boot();
</script>
</body>
</html>
