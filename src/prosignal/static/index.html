<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Signal — Equity Research</title>
<style>
/* ==========================================================================
   TOKENS
   Every colour in the interface resolves through this block. A component that
   invents its own is a component that breaks in one of the two themes, and
   dark mode here is designed rather than inverted -- the ground is a cool
   near-black, the surfaces lift toward slate, and the accent is lightened so
   it still reads against them.
   ========================================================================== */
:root {
  --ground:        #F6F5F2;   /* warm off-white, not paper-white */
  --surface:       #FFFFFF;
  --surface-2:     #FAF9F7;
  --surface-sunk:  #EFEEEA;
  --line:          #E2E0DA;
  --line-strong:   #CFCCC4;

  --ink:           #1B1D1F;
  --ink-2:         #55595E;
  --ink-3:         #85898F;

  --accent:        #12615F;   /* petrol */
  --accent-ink:    #FFFFFF;
  --accent-soft:   #E4EFEE;
  --accent-line:   #B9D4D2;

  --buy:           #1F6B43;
  --buy-soft:      #E6F0EA;
  --buy-line:      #BCD8C8;

  --watch:         #8A6212;
  --watch-soft:    #F6EFDF;
  --watch-line:    #E2D2AC;

  --neg:           #A33A32;
  --neg-soft:      #F7E9E7;

  --focus:         #12615F;

  --r-sm: 6px; --r-md: 10px; --r-lg: 14px;
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
  --sp-5: 24px; --sp-6: 32px; --sp-7: 48px; --sp-8: 64px;

  --shadow: 0 1px 2px rgba(24,26,28,.05), 0 4px 12px rgba(24,26,28,.04);
  --shadow-lift: 0 2px 4px rgba(24,26,28,.06), 0 12px 28px rgba(24,26,28,.08);

  --font: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  --maxw: 1160px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground:       #101214;
    --surface:      #17191C;
    --surface-2:    #1C1F22;
    --surface-sunk: #0C0E10;
    --line:         #2A2E33;
    --line-strong:  #3A3F45;

    --ink:          #ECEDEE;
    --ink-2:        #A2A7AD;
    --ink-3:        #71767C;

    --accent:       #4FB3AE;
    --accent-ink:   #06201F;
    --accent-soft:  #16302F;
    --accent-line:  #244846;

    --buy:          #64C08C;
    --buy-soft:     #14291D;
    --buy-line:     #24432F;

    --watch:        #D6AC5A;
    --watch-soft:   #2A2113;
    --watch-line:   #453620;

    --neg:          #E08078;
    --neg-soft:     #2B1917;

    --focus:        #4FB3AE;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 12px rgba(0,0,0,.3);
    --shadow-lift: 0 2px 4px rgba(0,0,0,.5), 0 12px 28px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"] {
  --ground:#101214; --surface:#17191C; --surface-2:#1C1F22; --surface-sunk:#0C0E10;
  --line:#2A2E33; --line-strong:#3A3F45;
  --ink:#ECEDEE; --ink-2:#A2A7AD; --ink-3:#71767C;
  --accent:#4FB3AE; --accent-ink:#06201F; --accent-soft:#16302F; --accent-line:#244846;
  --buy:#64C08C; --buy-soft:#14291D; --buy-line:#24432F;
  --watch:#D6AC5A; --watch-soft:#2A2113; --watch-line:#453620;
  --neg:#E08078; --neg-soft:#2B1917;
  --focus:#4FB3AE;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 12px rgba(0,0,0,.3);
  --shadow-lift: 0 2px 4px rgba(0,0,0,.5), 0 12px 28px rgba(0,0,0,.45);
}

/* ========================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--ground);
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
h1,h2,h3,h4 { margin: 0; font-weight: 600; letter-spacing: -0.011em; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 3px; }
.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }
.sr { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden;
      clip:rect(0 0 0 0); white-space:nowrap; border:0; }

/* --------------------------------------------------------------- shell */
.shell { max-width: var(--maxw); margin: 0 auto; padding: 0 var(--sp-5); }

.topbar {
  position: sticky; top: 0; z-index: 40;
  background: color-mix(in srgb, var(--ground) 88%, transparent);
  backdrop-filter: saturate(1.6) blur(12px);
  border-bottom: 1px solid var(--line);
}
.topbar-in {
  max-width: var(--maxw); margin: 0 auto; padding: var(--sp-3) var(--sp-5);
  display: flex; align-items: center; gap: var(--sp-5);
}
.brand { display: flex; align-items: baseline; gap: var(--sp-2); font-weight: 600;
         letter-spacing: -0.02em; font-size: 16px; }
.brand span { color: var(--ink-3); font-weight: 450; font-size: 12px;
              letter-spacing: .04em; text-transform: uppercase; }
.topbar-meta { margin-left: auto; display: flex; align-items: center;
               gap: var(--sp-4); font-size: 12.5px; color: var(--ink-2); }

.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block;
       margin-right: 6px; vertical-align: 1px; }
.dot.live { background: var(--buy); }
.dot.closed { background: var(--ink-3); }
.dot.stale { background: var(--watch); }

.iconbtn { background: transparent; border: 1px solid var(--line); width: 32px;
           height: 32px; border-radius: var(--r-sm); cursor: pointer;
           display: grid; place-items: center; color: var(--ink-2); }
.iconbtn:hover { background: var(--surface-2); color: var(--ink); }

/* ------------------------------------------------------------------ nav */
.nav { border-bottom: 1px solid var(--line); background: var(--ground); }
.nav-in { max-width: var(--maxw); margin: 0 auto; padding: 0 var(--sp-5);
          display: flex; gap: var(--sp-1); overflow-x: auto;
          scrollbar-width: none; }
.nav-in::-webkit-scrollbar { display: none; }
.nav button {
  background: none; border: 0; padding: var(--sp-3) var(--sp-3);
  color: var(--ink-2); cursor: pointer; font-size: 14px; white-space: nowrap;
  border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 450;
}
.nav button:hover { color: var(--ink); }
.nav button[aria-current="page"] { color: var(--ink); font-weight: 550;
                                   border-bottom-color: var(--accent); }

/* --------------------------------------------------------------- scan */
.scanbar { display: flex; align-items: flex-end; gap: var(--sp-5);
           padding: var(--sp-7) 0 var(--sp-5); flex-wrap: wrap; }
.scanbar h1 { font-size: clamp(24px, 3.4vw, 34px); letter-spacing: -0.025em; }
.scanbar .sub { color: var(--ink-2); font-size: 14.5px; margin-top: 6px; max-width: 60ch; }
.scanbar .grow { flex: 1 1 260px; }

.btn {
  appearance: none; border: 1px solid var(--accent); background: var(--accent);
  color: var(--accent-ink); border-radius: var(--r-md);
  padding: 11px 22px; font-size: 14.5px; font-weight: 550; cursor: pointer;
  display: inline-flex; align-items: center; gap: 9px; letter-spacing: -0.005em;
  transition: transform .12s ease, box-shadow .16s ease, filter .16s ease;
  box-shadow: var(--shadow);
}
.btn:hover:not(:disabled) { filter: brightness(1.08); box-shadow: var(--shadow-lift); }
.btn:active:not(:disabled) { transform: translateY(1px); box-shadow: var(--shadow); }
.btn:disabled { opacity: .5; cursor: not-allowed; box-shadow: none; }
/* `display` on the class beats the user-agent's [hidden] { display: none },
   so setting .hidden on a .btn changed the property and nothing on screen.
   Every element that sets its own display needs this said explicitly. */
.btn[hidden] { display: none; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line-strong); }
.btn.ghost:hover:not(:disabled) { background: var(--surface-2); filter: none; }
.btn.sm { padding: 7px 14px; font-size: 13px; }

@keyframes spin { to { transform: rotate(360deg); } }
.spinner { width: 14px; height: 14px; border-radius: 50%;
           border: 2px solid currentColor; border-right-color: transparent;
           animation: spin .7s linear infinite; }
@media (prefers-reduced-motion: reduce) {
  .spinner { animation-duration: 2.4s; }
  .btn { transition: none; }
}

/* ----------------------------------------------------------- market strip */
.market {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-lg); padding: var(--sp-5);
  display: grid; grid-template-columns: minmax(0,1.5fr) minmax(0,1fr);
  gap: var(--sp-5); align-items: start; box-shadow: var(--shadow);
}
.market h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .07em;
             color: var(--ink-3); font-weight: 550; margin-bottom: var(--sp-2); }
.market .headline { font-size: 21px; font-weight: 600; letter-spacing: -0.02em; }
.market .headline .pill { font-size: 12px; vertical-align: 3px; margin-left: 8px; }
.market p { color: var(--ink-2); font-size: 14px; margin-top: 6px; max-width: 52ch; }
.readings { display: grid; gap: var(--sp-2); }
.reading { display: grid; grid-template-columns: minmax(0, 1fr) auto;
           gap: var(--sp-2) var(--sp-4); padding: 10px 0;
           border-bottom: 1px solid var(--line); align-items: baseline; }
.reading:last-child { border-bottom: 0; }
.reading .k { color: var(--ink-2); font-size: 13.5px; }
.reading .v { font-weight: 550; font-size: 13.5px; text-align: right;
              white-space: nowrap; }
/* Its own row across both columns, left aligned. Right-aligning a full
   sentence under a one-word value is what made this read as broken. */
.reading .sub { grid-column: 1 / -1; color: var(--ink-3); font-size: 12.5px;
                margin-top: -2px; }

/* ------------------------------------------------------------- slate */
.slate-head { display: flex; align-items: center; gap: var(--sp-3);
              margin: var(--sp-7) 0 var(--sp-4); flex-wrap: wrap; }
.slate-head h2 { font-size: 20px; letter-spacing: -0.02em; }
.slate-head .count { color: var(--ink-2); font-size: 14px; }
.slate-head .note { flex-basis: 100%; color: var(--ink-3); font-size: 13px; }

.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px;
        font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
        padding: 3px 9px; border-radius: 100px; border: 1px solid transparent; }
.pill.buy   { background: var(--buy-soft);   color: var(--buy);   border-color: var(--buy-line); }
.pill.watch { background: var(--watch-soft); color: var(--watch); border-color: var(--watch-line); }
.pill.info  { background: var(--accent-soft);color: var(--accent);border-color: var(--accent-line); }
.pill::before { content: ""; width: 5px; height: 5px; border-radius: 50%;
                background: currentColor; }
button.pill { cursor: pointer; font-family: inherit;
              transition: filter .14s ease, box-shadow .14s ease; }
button.pill:hover { filter: brightness(.94); box-shadow: var(--shadow); }

.cards { display: grid; gap: var(--sp-3); }

.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-lg); padding: var(--sp-5);
  display: grid; gap: var(--sp-3); text-align: left; width: 100%;
  cursor: pointer; position: relative; overflow: hidden;
  transition: border-color .16s ease, box-shadow .16s ease, transform .16s ease;
}
.card::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 3px;
                background: var(--line-strong); }
.card.is-buy::before   { background: var(--buy); }
.card.is-watch::before { background: var(--watch); }
.card:hover { border-color: var(--line-strong); box-shadow: var(--shadow-lift);
              transform: translateY(-1px); }
@media (prefers-reduced-motion: reduce) { .card:hover { transform: none; } }

/* Two columns, never wrapping. The identity column is minmax(0,1fr) so a long
   company name wraps inside its own track instead of pushing the status and
   price somewhere else -- which is what made every card sit differently
   depending on how long the name happened to be. The right track sizes to its
   widest content and then holds still. */
.card-top { display: grid; grid-template-columns: minmax(0, 1fr) auto;
            gap: var(--sp-4); align-items: start; }
.card-id { min-width: 0; }
.card-id .rank { color: var(--ink-3); font-size: 12px; font-weight: 550;
                 letter-spacing: .06em; text-transform: uppercase; }
.card-id .name { font-size: 18px; font-weight: 600; letter-spacing: -0.02em;
                 margin-top: 2px; overflow-wrap: anywhere; line-height: 1.3; }
.card-id .tick { color: var(--ink-3); font-size: 12.5px; letter-spacing: .05em;
                 margin-top: 3px; overflow-wrap: anywhere; }
/* The status column: pill on top, price under it, aligned right on every
   screen so the eye finds them in the same place on all five cards. */
.card-meta { display: flex; flex-direction: column; align-items: flex-end;
             gap: 7px; text-align: right; }
.card-meta .p { font-size: 19px; font-weight: 600; letter-spacing: -0.02em;
                white-space: nowrap; }
.card-meta .s { color: var(--ink-2); font-size: 12.5px; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12.5px; color: var(--ink-2); background: var(--surface-sunk);
        border: 1px solid var(--line); border-radius: 100px; padding: 3px 10px; }
.card .thesis { color: var(--ink-2); font-size: 14px; line-height: 1.6;
                display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
                overflow: hidden; }
.card-foot { display: flex; align-items: center; justify-content: space-between;
             gap: var(--sp-3); flex-wrap: wrap; }
.confirm { font-size: 12.5px; color: var(--ink-3); }
.more { color: var(--accent); font-size: 13.5px; font-weight: 550; }

/* ------------------------------------------------------------- progress */
.progress { background: var(--surface); border: 1px solid var(--line);
            border-radius: var(--r-lg); padding: var(--sp-6);
            box-shadow: var(--shadow); }
.progress h3 { font-size: 16px; }
.progress .stage { color: var(--ink-2); font-size: 14px; margin-top: 4px; }
.track { display: flex; gap: 4px; margin: var(--sp-5) 0 var(--sp-3); }
.seg { height: 4px; flex: 1; border-radius: 2px; background: var(--surface-sunk);
       overflow: hidden; position: relative; }
.seg.done { background: var(--accent); }
.seg.now::after { content: ""; position: absolute; inset: 0;
                  background: var(--accent); transform-origin: left;
                  animation: fill 1.6s ease-in-out infinite; }
@keyframes fill { 0% { transform: scaleX(.05); opacity: .55; }
                  50% { transform: scaleX(.85); opacity: 1; }
                  100% { transform: scaleX(.05); opacity: .55; } }
@media (prefers-reduced-motion: reduce) {
  .seg.now::after { animation: none; transform: scaleX(.5); }
}
.progress .steps { color: var(--ink-3); font-size: 12.5px; }

/* --------------------------------------------------------------- journey */
.journey { display: grid; gap: 0; }
.jstep { display: grid; grid-template-columns: 1fr auto; gap: var(--sp-4);
         padding: var(--sp-4) 0; border-bottom: 1px solid var(--line);
         align-items: baseline; }
.jstep:last-child { border-bottom: 0; }
.jstep .l { font-weight: 500; font-size: 14.5px; }
.jstep .d { color: var(--ink-2); font-size: 13px; margin-top: 3px; max-width: 62ch; }
.jstep .n { font-size: 19px; font-weight: 600; text-align: right; }
.jstep .rm { color: var(--ink-3); font-size: 12px; font-weight: 400;
             display: block; text-align: right; }
.jstep.final .n { color: var(--accent); }

/* ---------------------------------------------------------------- panel */
.modal-wrap { position: fixed; inset: 0; z-index: 60; display: grid;
              place-items: center; padding: var(--sp-5);
              background: rgba(12,14,16,.5); }
.modal-wrap[hidden] { display: none; }
.modal { background: var(--surface); border: 1px solid var(--line);
         border-radius: var(--r-lg); padding: var(--sp-5);
         max-width: 420px; width: 100%; box-shadow: var(--shadow-lift); }
.modal h3 { font-size: 16px; margin-bottom: var(--sp-2); }
.modal p { color: var(--ink-2); font-size: 14px; line-height: 1.6; }
.modal-acts { display: flex; gap: var(--sp-2); justify-content: flex-end;
              margin-top: var(--sp-5); }

.scrim { position: fixed; inset: 0; background: rgba(12,14,16,.45);
         z-index: 50; opacity: 0; pointer-events: none; transition: opacity .2s ease; }
.scrim.open { opacity: 1; pointer-events: auto; }
.panel {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 100%);
  background: var(--ground); border-left: 1px solid var(--line);
  z-index: 51; transform: translateX(100%); transition: transform .24s cubic-bezier(.4,0,.2,1);
  display: flex; flex-direction: column; box-shadow: var(--shadow-lift);
}
.panel.open { transform: none; }
@media (prefers-reduced-motion: reduce) {
  .panel, .scrim { transition: none; }
}
.panel-head { padding: var(--sp-5); border-bottom: 1px solid var(--line);
              display: flex; gap: var(--sp-4); align-items: flex-start;
              background: var(--surface); }
.panel-body { overflow-y: auto; padding: var(--sp-5); display: grid;
              gap: var(--sp-6); }
.section h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .07em;
              color: var(--ink-3); font-weight: 550; margin-bottom: var(--sp-3); }
.prose { font-size: 14.5px; line-height: 1.65; color: var(--ink); }
.prose.muted { color: var(--ink-2); }

.ev { display: grid; gap: var(--sp-2); }
.ev-row { border: 1px solid var(--line); border-radius: var(--r-md);
          background: var(--surface); overflow: hidden; }
.ev-sum { display: flex; align-items: center; gap: var(--sp-3);
          padding: 12px var(--sp-4); cursor: pointer; list-style: none; }
.ev-sum::-webkit-details-marker { display: none; }
.ev-sum .lab { font-weight: 500; font-size: 14px; }
.ev-sum .vd { margin-left: auto; font-size: 12.5px; font-weight: 600; }
.ev-sum .car { color: var(--ink-3); transition: transform .18s ease; font-size: 11px; }
details[open] .ev-sum .car { transform: rotate(90deg); }
.ev-detail { padding: 0 var(--sp-4) var(--sp-4); border-top: 1px solid var(--line);
             padding-top: var(--sp-3); }
.ev-detail .d { color: var(--ink-2); font-size: 13.5px; margin-bottom: var(--sp-3); }
.sig { padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: 13.5px;
       line-height: 1.5; }
.sig:last-child { border-bottom: 0; }
.sig .sl { color: var(--ink-2); }
.sig .sv { font-weight: 550; white-space: nowrap; }
.v-pos { color: var(--buy); } .v-neg { color: var(--neg); } .v-neu { color: var(--ink-2); }

.levels { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px,1fr));
          gap: var(--sp-2); }
.level { background: var(--surface); border: 1px solid var(--line);
         border-radius: var(--r-md); padding: var(--sp-3); }
.level .k { color: var(--ink-3); font-size: 11.5px; text-transform: uppercase;
            letter-spacing: .05em; }
.level .v { font-size: 16px; font-weight: 600; margin-top: 3px; }

.callout { background: var(--surface-2); border: 1px solid var(--line);
           border-left: 3px solid var(--accent); border-radius: var(--r-md);
           padding: var(--sp-4); font-size: 14px; line-height: 1.6; color: var(--ink-2); }
.callout.watch { border-left-color: var(--watch); }

details.adv { border: 1px solid var(--line); border-radius: var(--r-md);
              background: var(--surface); }
details.adv > summary { padding: 12px var(--sp-4); cursor: pointer;
                        font-size: 13.5px; color: var(--ink-2); list-style: none; }
details.adv > summary::-webkit-details-marker { display: none; }
details.adv > summary::before { content: "▸ "; color: var(--ink-3); }
details.adv[open] > summary::before { content: "▾ "; }
details.adv .adv-body { padding: 0 var(--sp-4) var(--sp-4); }
.raw { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2);
       background: var(--surface-sunk); border: 1px solid var(--line);
       border-radius: var(--r-sm); padding: var(--sp-3); overflow-x: auto;
       white-space: pre-wrap; word-break: break-word; line-height: 1.5; }

/* ----------------------------------------------------------------- table */
.tablewrap { overflow-x: auto; border: 1px solid var(--line);
             border-radius: var(--r-lg); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { padding: 11px var(--sp-4); text-align: left; white-space: nowrap; }
th { background: var(--surface-2); color: var(--ink-3); font-weight: 550;
     font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em;
     border-bottom: 1px solid var(--line); position: sticky; top: 0; }
td { border-bottom: 1px solid var(--line); }
tbody tr:last-child td { border-bottom: 0; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--surface-2); }
td.r { text-align: right; }

/* ----------------------------------------------------------------- misc */
.panel-section { margin-top: var(--sp-7); }
.panel-section > h2 { font-size: 18px; letter-spacing: -0.02em;
                      margin-bottom: var(--sp-2); }
.panel-section > .lead { color: var(--ink-2); font-size: 14px;
                         margin-bottom: var(--sp-4); max-width: 68ch; }
.box { background: var(--surface); border: 1px solid var(--line);
       border-radius: var(--r-lg); padding: var(--sp-5); box-shadow: var(--shadow); }

.empty { text-align: center; padding: var(--sp-8) var(--sp-5); }
.empty h3 { font-size: 17px; margin-bottom: var(--sp-2); }
.empty p { color: var(--ink-2); font-size: 14.5px; max-width: 48ch;
           margin: 0 auto var(--sp-5); }

.err { border-left: 3px solid var(--neg); background: var(--neg-soft);
       border-radius: var(--r-md); padding: var(--sp-5); }
.err h3 { font-size: 15.5px; margin-bottom: 6px; }
.err p { color: var(--ink-2); font-size: 14px; margin-bottom: var(--sp-4); }

.foot { color: var(--ink-3); font-size: 12px; line-height: 1.6;
        border-top: 1px solid var(--line); margin-top: var(--sp-8);
        padding: var(--sp-5) 0 var(--sp-8); max-width: 78ch; }

.skel { background: linear-gradient(90deg, var(--surface-sunk) 25%,
        var(--surface-2) 37%, var(--surface-sunk) 63%);
        background-size: 400% 100%; animation: sk 1.4s ease infinite;
        border-radius: var(--r-sm); }
@keyframes sk { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
@media (prefers-reduced-motion: reduce) { .skel { animation: none; } }

/* ------------------------------------------------------------ responsive */
@media (max-width: 860px) {
  .market { grid-template-columns: 1fr; gap: var(--sp-4); }
  .topbar-meta .hide-sm { display: none; }
}
@media (max-width: 640px) {
  body { font-size: 14.5px; }
  .shell, .topbar-in, .nav-in { padding-left: var(--sp-4); padding-right: var(--sp-4); }
  .scanbar { padding-top: var(--sp-5); gap: var(--sp-4); }
  .scanbar .btn { width: 100%; justify-content: center; }
  .card { padding: var(--sp-4); }
  .card-top { gap: var(--sp-3); }
  .panel { width: 100%; border-left: 0; }
  .jstep { grid-template-columns: 1fr auto; }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand">Signal <span>Equity Research</span></div>
    <div class="topbar-meta">
      <span id="mkt-status"><span class="dot closed"></span>Loading</span>
      <span class="hide-sm" id="mkt-fresh"></span>
      <button class="iconbtn" id="theme" aria-label="Switch between light and dark theme" title="Theme">◐</button>
    </div>
  </div>
</header>

<nav class="nav" aria-label="Sections">
  <div class="nav-in" role="tablist">
    <button role="tab" data-view="overview" aria-current="page">Today</button>
    <button role="tab" data-view="history">History</button>
  </div>
</nav>

<main class="shell" id="main">
  <div class="scanbar">
    <div class="grow">
      <h1 id="page-title">Today's opportunities</h1>
      <p class="sub" id="page-sub">Run a scan to rank the market and surface the strongest setups.</p>
    </div>
    <button class="btn" id="scan">Scan Market</button>
  </div>

  <div id="live" role="status" aria-live="polite" class="sr"></div>
  <div id="view"></div>

  <div class="foot" id="foot"></div>
</main>

<div class="scrim" id="scrim"></div>

<div class="modal-wrap" id="ask" role="dialog" aria-modal="true" aria-labelledby="ask-title" hidden>
  <div class="modal">
    <h3 id="ask-title">Clear the run history?</h3>
    <p id="ask-body"></p>
    <div class="modal-acts">
      <button class="btn ghost sm" id="ask-no">Cancel</button>
      <button class="btn sm" id="ask-yes">Clear history</button>
    </div>
  </div>
</div>
<aside class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title" tabindex="-1">
  <div class="panel-head">
    <div style="flex:1;min-width:0">
      <div class="card-id">
        <div class="rank" id="panel-rank"></div>
        <div class="name" id="panel-title"></div>
        <div class="tick" id="panel-tick"></div>
      </div>
    </div>
    <button class="iconbtn" id="panel-close" aria-label="Close details">✕</button>
  </div>
  <div class="panel-body" id="panel-body"></div>
</aside>

<script>
"use strict";
/* ==========================================================================
   The interface binds to /analysis/{id}/view and never to /results.
   That endpoint is the presentation layer's output: names already joined,
   evidence already grouped, prose already written from the engine's own
   values. Anything this file had to compute would be a second, divergent
   implementation of a decision the backend already made.
   ========================================================================== */
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));

const state = { view: null, run: null, tab: "overview", busy: false,
                error: null, notReady: false, history: undefined,
                latestSession: null };

/* ---------------------------------------------------------------- theme */
const THEME_KEY = "signal.theme";
function applyTheme(t) {
  if (t === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
  try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
}
(function () {
  let t = "auto";
  try { t = localStorage.getItem(THEME_KEY) || "auto"; } catch (e) {}
  applyTheme(t);
  $("#theme").addEventListener("click", () => {
    let cur = "auto";
    try { cur = localStorage.getItem(THEME_KEY) || "auto"; } catch (e) {}
    applyTheme(cur === "auto" ? "light" : cur === "light" ? "dark" : "auto");
  });
})();

/* ------------------------------------------------------------- helpers */
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g,
  (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));

function money(v) {
  if (v == null || !isFinite(v)) return "—";
  return "₹" + Number(v).toLocaleString("en-IN",
    { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function when(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  if (isNaN(d)) return String(iso);
  return d.toLocaleString("en-IN",
    { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" });
}
function say(msg) { $("#live").textContent = msg; }

/* "2026-08-21" is a key, not a date. */
function day(iso) {
  if (!iso) return "—";
  const d = new Date(iso + "T00:00:00");
  if (isNaN(d)) return String(iso);
  return d.toLocaleDateString("en-IN",
    { day: "numeric", month: "short", year: "numeric" });
}

function ask(title, body, confirmLabel) {
  return new Promise((resolve) => {
    $("#ask-title").textContent = title;
    $("#ask-body").textContent = body;
    $("#ask-yes").textContent = confirmLabel;
    const box = $("#ask");
    box.hidden = false;
    $("#ask-yes").focus();
    const done = (answer) => {
      box.hidden = true;
      $("#ask-yes").onclick = null;
      $("#ask-no").onclick = null;
      document.removeEventListener("keydown", onKey);
      resolve(answer);
    };
    const onKey = (e) => { if (e.key === "Escape") done(false); };
    $("#ask-yes").onclick = () => done(true);
    $("#ask-no").onclick = () => done(false);
    document.addEventListener("keydown", onKey);
  });
}

/* One row per past call, used by both the day view and the stock view.
   A name flagged today has nothing to report, and saying so plainly beats
   printing zeroes and dashes into every column. */
function outcomeRow(o, headline, sub) {
  const pending = o.resolved === "pending";
  const verdict =
    o.resolved === "target" ? '<span class="pill buy">Target reached</span>' :
    o.resolved === "stop"   ? '<span class="pill watch">Stop touched</span>' :
    o.resolved === "both"   ? '<span class="chip">Target and stop both touched</span>' :
    pending                 ? '<span class="chip">Not followed yet</span>' :
                              '<span class="chip">Still running</span>';

  const move = pending
    ? '<span class="v-neu">Awaiting the next session</span>'
    : pctHTML(o.change_pct);
  const sessions = pending ? "" :
    '<div style="color:var(--ink-3);font-size:12px">' +
    o.sessions + (o.sessions === 1 ? " session" : " sessions") + '</div>';

  const prices = pending
    ? money(o.signal_price) + " when flagged"
    : money(o.signal_price) + " when flagged  →  " + money(o.last_price) + " now";

  // "Peak" and "trough" are trading desk words. This says what they mean.
  const range = (!pending && o.peak_gain_pct != null && o.worst_drop_pct != null)
    ? '<div class="sig" style="border-bottom:0;padding:4px 0 0">' +
      '<span class="v-neu" style="font-size:12.5px">Best it reached ' +
      (o.peak_gain_pct > 0 ? "+" : "") + o.peak_gain_pct.toFixed(2) +
      '%, worst it fell ' + o.worst_drop_pct.toFixed(2) + '%</span></div>'
    : "";

  return '<div class="ev-row" style="padding:var(--sp-4)">' +
    '<div style="display:grid;grid-template-columns:minmax(0,1fr) auto;' +
      'gap:var(--sp-3);align-items:start">' +
      '<div style="min-width:0">' + headline +
        '<div style="color:var(--ink-3);font-size:12.5px">' + sub + '</div></div>' +
      '<div style="text-align:right">' + move + sessions + '</div>' +
    '</div>' +
    '<div class="sig" style="border-bottom:0;padding-top:var(--sp-3)">' +
      '<span class="v-neu">' + prices + '</span></div>' + range +
    '<div style="margin-top:8px">' + verdict + '</div>' +
    (o.note ? '<p class="prose muted" style="font-size:12.5px;margin-top:8px">' +
      esc(o.note) + '</p>' : "") +
  '</div>';
}

/* --------------------------------------------------------------- stages
   Nine real pipeline stages. The engine reports which one it is on, so the
   indicator reflects backend state rather than a timer pretending to. */
const STAGES = [
  "Preparing today's market data",
  "Validating data quality",
  "Mapping broader market conditions",
  "Screening for tradable names",
  "Ranking the market",
  "Testing against false signals",
  "Checking entry criteria",
  "Building risk and exit plans",
  "Selecting the highest-conviction names",
];

/* ----------------------------------------------------------------- scan */
async function scan() {
  if (state.busy) return;
  state.busy = true; state.error = null;
  const btn = $("#scan");
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Scanning';
  say("Market scan started.");
  renderProgress(0);

  try {
    const start = await fetch("/analysis/run", { method: "POST" });
    if (!start.ok) throw new Error(await readErr(start));
    const { id } = await start.json();

    let last = -1;
    for (;;) {
      await new Promise((r) => setTimeout(r, 900));
      const s = await fetch("/analysis/" + id);
      if (!s.ok) throw new Error(await readErr(s));
      const job = await s.json();
      const step = (job.progress && job.progress.step) || 0;
      if (step !== last) { renderProgress(step); last = step; }
      if (job.state === "COMPLETED") break;
      if (job.state === "FAILED") throw new Error(job.error || "The scan did not finish.");
      if (job.state === "CANCELLED") throw new Error("The scan was cancelled.");
    }

    const r = await fetch("/analysis/" + id + "/view");
    if (!r.ok) throw new Error(await readErr(r));
    state.view = await r.json();
    state.run = id;
    say("Scan complete. " + state.view.summary.buy + " qualifying, "
        + state.view.summary.watch + " monitored.");
  } catch (e) {
    state.error = e.message || String(e);
    say("The scan could not be completed.");
  } finally {
    state.busy = false;
    btn.disabled = false;
    btn.textContent = "Scan Market";
    render();
  }
}

async function bootstrap() {
  const btn = $("#boot");
  if (!btn || btn.disabled) return;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Fetching';
  const note = $("#boot-note");
  note.textContent = "Fetching from NSE. This takes a few minutes per block.";
  try {
    const r = await fetch("/admin/bootstrap", { method: "POST" });
    if (!r.ok) throw new Error(await readErr(r));
    const { id } = await r.json();
    for (;;) {
      await new Promise((res) => setTimeout(res, 1500));
      const s = await fetch("/analysis/" + id);
      if (!s.ok) throw new Error(await readErr(s));
      const job = await s.json();
      if (job.progress && job.progress.label) note.textContent = job.progress.label;
      if (job.state === "COMPLETED") break;
      if (job.state === "FAILED") throw new Error(job.error || "The build did not finish.");
    }
    await checkReady();
    render();
  } catch (e) {
    note.textContent = e.message || String(e);
    btn.disabled = false;
    btn.textContent = "Build data store";
  }
}

async function checkReady() {
  try {
    const r = await fetch("/ready");
    if (!r.ok) { state.notReady = true; return; }
    const j = await r.json();
    state.notReady = !j.ready;
    state.latestSession = (j.checks && j.checks.latest_session) || null;
  } catch (e) { state.notReady = false; }
}

async function readErr(res) {
  try {
    const j = await res.json();
    const d = j.detail;
    if (typeof d === "string") return d;
    if (d && d.message) return d.message;
  } catch (e) {}
  return "The service returned an error (" + res.status + ").";
}

function renderProgress(step) {
  const total = STAGES.length;
  const segs = STAGES.map((_, i) =>
    '<div class="seg ' + (i < step ? "done" : i === step ? "now" : "") + '"></div>').join("");
  $("#view").innerHTML =
    '<div class="progress">' +
      '<h3>Scanning the market</h3>' +
      '<div class="stage">' + esc(STAGES[Math.min(step, total - 1)]) + '</div>' +
      '<div class="track">' + segs + '</div>' +
      '<div class="steps">Step ' + Math.min(step + 1, total) + ' of ' + total + '</div>' +
    '</div>';
}

/* ---------------------------------------------------------------- render */
function render() {
  $$(".nav button").forEach((b) => {
    if (b.dataset.view === state.tab) b.setAttribute("aria-current", "page");
    else b.removeAttribute("aria-current");
  });

  if (state.error) return renderError();
  if (state.busy) return;

  if (state.notReady) {
    $("#view").innerHTML =
      '<div class="box empty"><h3>Market data store is empty</h3>' +
      '<p>There is not enough price history stored to rank anything yet. ' +
      'Building it fetches from NSE in chunks and can be resumed — each press ' +
      'adds another block of sessions.</p>' +
      '<button class="btn" id="boot">Build data store</button>' +
      '<p id="boot-note" style="margin-top:var(--sp-4);font-size:13px"></p></div>';
    $("#boot").addEventListener("click", bootstrap);
    return;
  }

  const v = state.view;
  if (!v) {
    $("#view").innerHTML =
      '<div class="box empty"><h3>No scan has run yet</h3>' +
      '<p>The engine ranks the market against a model fitted on point-in-time ' +
      'data, then narrows to the setups that clear every risk check.</p>' +
      '<button class="btn" onclick="document.getElementById(\'scan\').click()">Scan Market</button></div>';
    return;
  }

  renderChrome(v);
  const body = state.tab === "history" ? viewHistory(v) : viewOverview(v);
  $("#view").innerHTML = body;
  wire();
}

function renderChrome(v) {
  const d = (v && v.data) || {};
  const fresh = d.complete !== false;
  const flags = (d.flags || []).length;
  $("#mkt-status").innerHTML =
    '<span class="dot ' + (fresh ? "live" : "stale") + '"></span>' +
    (v && v.as_of ? esc(v.as_of) : esc(state.latestSession || "—"));
  $("#mkt-status").title = fresh
    ? "All expected data was available for this run."
    : flags + (flags === 1 ? " data note" : " data notes") +
      " on this run — see Market environment.";
  $("#mkt-fresh").textContent = v ? "Analysed " + when(v.generated_at) : "";

  const titles = {
    overview: ["Today's opportunities", "The names the engine ranks highest, and the case for each."],
    history: ["History", "Past runs, and what the market did afterwards."],
  };
  const [title, sub] = titles[state.tab] || titles.overview;
  $("#page-title").textContent = title;
  $("#page-sub").textContent = sub;

  // The scan button is an action, not a decoration. It belongs at the top only
  // when pressing it is the thing to do -- there is no run for the newest
  // session yet. Once the session is scanned, offering "scan again" at the top
  // of the results invites re-running an analysis that would return the same
  // answer from the same data.
  const btn = $("#scan");
  const onResults = state.tab === "overview";
  const needsScan = onResults && !state.busy && !isCurrent(v);
  btn.hidden = !needsScan;
  if (needsScan) {
    btn.textContent = state.latestSession
      ? "Scan " + state.latestSession
      : "Scan Market";
  }
  $("#page-sub").textContent = onResults && isCurrent(v)
    ? "Ranked from the close of " + esc(v.as_of) + "."
    : sub;

  $("#foot").innerHTML =
    (v && v.disclaimer ? esc(v.disclaimer) + "<br><br>" : "") +
    (v && v.confidence_note ? esc(v.confidence_note) : "");
}

/* Whether the loaded results describe the newest session the store holds.
   Anything older is a previous day's answer and must not be presented as
   today's -- that is the difference between stale and wrong. */
function isCurrent(v) {
  if (!v || !v.as_of) return false;
  if (!state.latestSession) return true;   // nothing to compare against
  return String(v.as_of) === String(state.latestSession);
}

function renderError() {
  $("#view").innerHTML =
    '<div class="box err"><h3>This scan could not be completed</h3>' +
    '<p>' + esc(state.error) + '</p>' +
    '<button class="btn sm" onclick="document.getElementById(\'scan\').click()">Try again</button></div>';
}

/* -------------------------------------------------------------- overview */
function viewOverview(v) {
  // No results for the newest session: show the one action, and nothing else.
  // A previous day's shortlist rendered under today's heading is not stale
  // data, it is the wrong answer presented confidently.
  if (!isCurrent(v)) {
    const stale = v && v.as_of;
    return '<div class="box empty">' +
      '<h3>' + (stale ? "This session has not been scanned yet"
                      : "No scan has run yet") + '</h3>' +
      '<p>' + (stale
        ? "The most recent results are from " + esc(v.as_of) +
          ". Market data is stored through " + esc(state.latestSession || "—") +
          ", so those are a previous session's answer and are not shown here."
        : "The engine ranks every eligible name against the market on the day, " +
          "then narrows to the setups that clear each risk check.") + '</p>' +
      '<button class="btn" onclick="document.getElementById(\'scan\').click()">' +
      (state.latestSession ? "Scan " + esc(state.latestSession) : "Scan Market") +
      '</button></div>';
  }

  const s = v.summary || {};
  if (s.withheld) {
    return marketBlock(v) +
      '<div class="box empty" style="margin-top:var(--sp-5)">' +
      '<h3>No recommendation was produced</h3><p>' + esc(s.withheld) + '</p></div>';
  }
  if (!v.picks || !v.picks.length) {
    return marketBlock(v) +
      '<div class="box empty" style="margin-top:var(--sp-5)">' +
      '<h3>Nothing met the bar today</h3>' +
      '<p>No name qualified, and none came close enough to be worth monitoring. ' +
      'That is a result, not a failure to find one.</p></div>';
  }

  const counts = [];
  if (s.buy)   counts.push('<span class="pill buy">' + s.buy + ' Buy</span>');
  if (s.watch) counts.push('<span class="pill watch">' + s.watch + ' Watch</span>');

  return marketBlock(v) +
    '<div class="slate-head">' +
      '<h2>Shortlist</h2>' +
      '<div class="count">' + counts.join(" ") + '</div>' +
      '<div class="note">' + esc(s.note || "") + '</div>' +
    '</div>' +
    '<div class="cards">' + v.picks.map(cardHTML).join("") + '</div>' +
    '<div style="margin-top:var(--sp-6);text-align:center">' +
      '<button class="btn ghost sm" onclick="document.getElementById(\'scan\').click()">' +
      'Re-run this scan</button>' +
      '<p class="prose muted" style="font-size:12.5px;margin-top:8px">' +
      'The data has not changed since this ran, so a re-run returns the same ' +
      'ranking.</p></div>';
}

function marketBlock(v) {
  const m = v.market || {};
  const j = v.journey || [];
  const step = (k) => (j.find((x) => x.key === k) || {}).count;
  const universe = step("universe_considered");
  const eligible = step("passed_eligibility");
  const survived = step("survived_defense");

  const rows = (m.readings || []).filter((r) => r.value).map((r) =>
    '<div class="reading"><span class="k">' + esc(r.label) + '</span>' +
    '<span class="v">' + esc(r.value) + '</span>' +
    (r.detail ? '<span class="sub">' + esc(r.detail) + '</span>' : "") +
    '</div>').join("");

  // The narrowing, in one line. It is the most concrete thing the run
  // produced about the market and it was previously on a separate screen.
  const narrowing = (universe && eligible)
    ? '<div class="reading"><span class="k">Names examined</span>' +
      '<span class="v num">' + universe.toLocaleString("en-IN") + '</span>' +
      '<span class="sub">' + eligible.toLocaleString("en-IN") + ' tradable' +
      (survived ? ', ' + survived + ' cleared every risk check' : '') +
      '</span></div>'
    : "";

  const warn = m.allows_new_positions === false
    ? '<span class="pill watch">New positions paused</span>' : "";
  const notes = ((v.data || {}).flags || []);
  const notesHTML = notes.length
    ? '<details class="adv" style="margin-top:var(--sp-4);grid-column:1/-1">' +
      '<summary>' + notes.length +
      (notes.length === 1 ? " data note" : " data notes") +
      ' on this run</summary><div class="adv-body">' +
      notes.map((n) => '<p class="prose muted" style="font-size:13px;' +
        'margin-bottom:8px">' + esc(n) + '</p>').join("") +
      '</div></details>'
    : "";

  return '<div class="market">' +
    '<div><h2>Market environment</h2>' +
      '<div class="headline">' + esc(m.headline || "—") + " " + warn + '</div>' +
      '<p>' + esc(m.summary || "") + '</p></div>' +
    '<div class="readings">' + rows + narrowing + '</div>' +
    notesHTML + '</div>';
}

function cardHTML(p) {
  const isBuy = p.status === "BUY";
  const chips = (p.highlights || []).map((h) => '<span class="chip">' + esc(h) + '</span>').join("");
  const c = p.confirmation || {};
  return '<button class="card ' + (isBuy ? "is-buy" : "is-watch") + '" ' +
    'data-pos="' + p.position + '">' +
    '<div class="card-top">' +
      '<div class="card-id">' +
        '<div class="rank">Rank ' + (p.rank ?? "—") + '</div>' +
        '<div class="name">' + esc(p.company) + '</div>' +
        '<div class="tick">' + esc(p.ticker) + (p.sector ? " · " + esc(p.sector) : "") + '</div>' +
      '</div>' +
      '<div class="card-meta">' +
        '<span class="pill ' + (isBuy ? "buy" : "watch") + '">' + (isBuy ? "Buy" : "Watch") + '</span>' +
        '<div class="p num">' + money(p.price) + '</div>' +
        '<div class="s">' + esc(p.strength || "") + '</div>' +
      '</div>' +
    '</div>' +
    (chips ? '<div class="chips">' + chips + '</div>' : "") +
    (p.thesis ? '<div class="thesis">' + esc(p.thesis) + '</div>' : "") +
    '<div class="card-foot">' +
      '<span class="confirm">' + (c.judged ? c.agree + " of " + c.judged + " areas support this" : "") + '</span>' +
      '<span class="more">View analysis →</span>' +
    '</div></button>';
}

/* --------------------------------------------------------------- history */
function viewHistory(v) {
  const h = state.history;
  if (h === null) return '<div class="box"><div class="skel" style="height:220px"></div></div>';
  if (!h || !h.days || !h.days.length) {
    return '<div class="box empty"><h3>No runs recorded yet</h3>' +
      '<p>' + esc((h && h.note) || "Once a scan completes it is recorded here, " +
      "with what the market did afterwards.") + '</p></div>';
  }

  const rows = h.days.map((d) => {
    // Each name is its own control. Opening the row shows that day; opening a
    // name shows every time the engine has flagged it.
    const shown = (d.shown || []).map((x) =>
      '<button class="pill ' + (x.status === "BUY" ? "buy" : "watch") + '" ' +
      'data-stock="' + esc(x.ticker) + '" style="margin:0 4px 4px 0" ' +
      'title="See every run that flagged ' + esc(x.ticker) + '">' +
      esc(x.ticker) + '</button>').join("");
    return '<tr data-date="' + esc(d.date) + '">' +
      '<td class="num">' + esc(day(d.date)) + '</td>' +
      '<td class="num">' + d.buy_count + '</td>' +
      '<td class="num">' + d.watch_count + '</td>' +
      '<td>' + esc(d.regime) + '</td>' +
      '<td style="white-space:normal;min-width:230px">' + shown + '</td></tr>';
  }).join("");

  return '<div style="display:flex;align-items:center;gap:var(--sp-3);' +
      'margin-bottom:var(--sp-3);flex-wrap:wrap">' +
      '<span class="prose muted" style="font-size:13px;flex:1">' +
      'Open a date for that run, or a name for every run that flagged it.</span>' +
      '<button class="btn ghost sm" id="wipe">Clear history</button></div>' +
    '<div class="tablewrap"><table><thead><tr>' +
    '<th>Date</th><th>Buy</th><th>Watch</th><th>Market</th><th>Shortlist</th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table></div>';
}

async function confirmWipe() {
  const ok = await ask(
    "Clear the run history?",
    "This screen will start again from your next scan. The underlying " +
    "research record is kept — the trial count used to test whether the " +
    "strategy beats luck depends on it — so it is hidden here, not deleted.",
    "Clear history"
  );
  if (!ok) return;
  try {
    const r = await fetch("/history", { method: "DELETE" });
    if (!r.ok) throw new Error(await readErr(r));
    const j = await r.json();
    say(j.message || "History cleared.");
    await loadHistory();
  } catch (e) {
    state.error = e.message || String(e);
    render();
  }
}

/* ---------------------------------------------------------- one stock */
async function openStock(ticker) {
  lastFocus = document.activeElement;
  $("#panel-rank").textContent = "Past calls";
  $("#panel-title").textContent = ticker;
  $("#panel-tick").textContent = "";
  $("#panel-body").innerHTML = '<div class="skel" style="height:200px"></div>';
  $("#panel").classList.add("open");
  $("#scrim").classList.add("open");
  $("#panel").focus();
  document.body.style.overflow = "hidden";

  let d;
  try {
    const r = await fetch("/stock/" + encodeURIComponent(ticker) + "/history");
    if (!r.ok) throw new Error(await readErr(r));
    d = await r.json();
  } catch (e) {
    $("#panel-body").innerHTML =
      '<div class="err"><h3>That name could not be loaded</h3><p>' +
      esc(e.message || String(e)) + '</p></div>';
    return;
  }

  $("#panel-title").textContent = d.company;
  $("#panel-tick").textContent = d.ticker +
    (d.last_price != null ? " · " + money(d.last_price) + " now" : "");
  $("#panel-rank").textContent = d.times_flagged === 1
    ? "Flagged once" : "Flagged " + d.times_flagged + " times";

  if (!d.runs || !d.runs.length) {
    $("#panel-body").innerHTML = '<div class="prose muted">' +
      esc((d.summary || {}).text || "") + '</div>';
    return;
  }
  const rows = d.runs.map((r) => outcomeRow(
    r.outcome,
    '<div style="font-weight:600">' + esc(day(r.date)) + '</div>',
    "Flagged as " + (r.status === "BUY" ? "Buy" : "Watch") +
    (r.regime ? " · " + esc(r.regime) : "")
  )).join("");

  $("#panel-body").innerHTML =
    '<div class="section"><h3>How these calls have gone</h3>' +
      '<p class="prose">' + esc((d.summary || {}).text || "") + '</p></div>' +
    '<div class="section"><h3>Every call</h3><div class="ev">' + rows + '</div></div>' +
    '<div class="callout">' + esc(d.disclaimer || "") + '</div>';
}

/* ------------------------------------------------------------ past day */
async function openDay(date) {
  lastFocus = document.activeElement;
  $("#panel-rank").textContent = "Run of";
  $("#panel-title").textContent = day(date);
  $("#panel-tick").textContent = "";
  $("#panel-body").innerHTML = '<div class="skel" style="height:200px"></div>';
  $("#panel").classList.add("open");
  $("#scrim").classList.add("open");
  $("#panel").focus();
  document.body.style.overflow = "hidden";

  let d;
  try {
    const r = await fetch("/history/" + encodeURIComponent(date));
    if (!r.ok) throw new Error(await readErr(r));
    d = await r.json();
  } catch (e) {
    $("#panel-body").innerHTML =
      '<div class="err"><h3>That run could not be loaded</h3><p>' +
      esc(e.message || String(e)) + '</p></div>';
    return;
  }
  $("#panel-tick").textContent = d.regime || "";
  $("#panel-body").innerHTML = dayHTML(d);
}

function pctHTML(value) {
  if (value == null) return '<span class="v-neu">—</span>';
  const cls = value > 0 ? "v-pos" : value < 0 ? "v-neg" : "v-neu";
  return '<span class="' + cls + ' num">' + (value > 0 ? "+" : "") +
         value.toFixed(2) + '%</span>';
}

function dayHTML(d) {
  if (!d.picks || !d.picks.length) {
    return '<div class="prose muted">' + esc((d.summary || {}).text || "") + '</div>';
  }
  const s = d.summary || {};
  const rows = d.picks.map((p) => outcomeRow(
    p.outcome,
    '<div style="font-weight:600;overflow-wrap:anywhere">' + esc(p.company) + '</div>',
    esc(p.ticker) + " · flagged as " + (p.status === "BUY" ? "Buy" : "Watch")
  )).join("");

  // Only show the tally when there is something to tally. A run made today
  // has no sessions behind it, and three cards reading "0 of 0" say nothing.
  const tally = s.tracked
    ? '<div class="levels" style="margin-top:var(--sp-3)">' +
        '<div class="level"><div class="k">Average move</div><div class="v num">' +
          (s.average_change_pct > 0 ? "+" : "") + s.average_change_pct + '%</div></div>' +
        '<div class="level"><div class="k">Reached target</div><div class="v num">' +
          s.targets_hit + ' of ' + s.tracked + '</div></div>' +
        '<div class="level"><div class="k">Touched stop</div><div class="v num">' +
          s.stops_hit + ' of ' + s.tracked + '</div></div>' +
      '</div>'
    : "";

  return '<div class="section">' +
      '<h3>' + (s.tracked ? "Since this run" : "Nothing to measure yet") + '</h3>' +
      '<p class="prose">' + esc(s.text || "") + '</p>' + tally +
    '</div>' +
    '<div class="section"><h3>The shortlist on ' + esc(day(d.date)) + '</h3>' +
      '<div class="ev">' + rows + '</div></div>' +
    '<div class="callout">' + esc(d.disclaimer || "") + '</div>';
}

/* ----------------------------------------------------------------- panel */
let lastFocus = null;
function openPanel(pick) {
  lastFocus = document.activeElement;
  $("#panel-rank").textContent =
    (pick.status === "BUY" ? "Qualifying setup" : "Monitored") +
    (pick.rank ? " · Rank " + pick.rank : "");
  $("#panel-title").textContent = pick.company;
  $("#panel-tick").textContent = pick.ticker + (pick.sector ? " · " + pick.sector : "");
  $("#panel-body").innerHTML = panelHTML(pick);
  $("#panel").classList.add("open");
  $("#scrim").classList.add("open");
  $("#panel").focus();
  document.body.style.overflow = "hidden";
}
function closePanel() {
  $("#panel").classList.remove("open");
  $("#scrim").classList.remove("open");
  document.body.style.overflow = "";
  if (lastFocus) lastFocus.focus();
}

function row(k, val) {
  return '<div class="reading"><span class="k">' + esc(k) + '</span>' +
         '<span class="v">' + esc(val == null ? "—" : val) + '</span></div>';
}

function panelHTML(p) {
  const isBuy = p.status === "BUY";
  const ev = (p.evidence || []).map((c) => {
    const cls = ["Strong","Supportive","Contained"].includes(c.verdict) ? "v-pos"
              : ["Weak","Soft","Elevated"].includes(c.verdict) ? "v-neg" : "v-neu";
    // The whole reading on one line. Splitting it into label and value meant
    // stripping the label back out of a sentence that already contained it,
    // and the category detail then repeated the first row verbatim.
    const sigs = (c.signals || []).map((s) =>
      '<div class="sig"><span class="' +
      (s.oriented_sd > .35 ? "v-pos" : s.oriented_sd < -.35 ? "v-neg" : "v-neu") +
      '">' + esc(s.reading) + '</span></div>').join("");
    return '<details class="ev-row"><summary class="ev-sum">' +
      '<span class="car">▶</span><span class="lab">' + esc(c.label) + '</span>' +
      '<span class="vd ' + cls + '">' + esc(c.verdict) + '</span></summary>' +
      '<div class="ev-detail">' +
      (sigs ? sigs : '<div class="d">' + esc(c.detail) + '</div>') +
      '</div></details>';
  }).join("");

  const L = p.levels || {};
  const lv = [
    L.entry ? ["Entry zone", money(L.entry[0]) + " – " + money(L.entry[1])] : null,
    L.stop != null ? ["Initial stop", money(L.stop)] : null,
    L.invalidation != null ? ["Invalidation", money(L.invalidation)] : null,
    L.target_1 != null ? ["First target", money(L.target_1)] : null,
  ].filter(Boolean).map(([k, val]) =>
    '<div class="level"><div class="k">' + k + '</div><div class="v num">' + val + '</div></div>').join("");

  const t = p.technical || {};
  return [
    '<div class="section"><h3>Why this name</h3>' +
      '<p class="prose">' + esc(p.thesis || "") + '</p></div>',
    p.what_would_change
      ? '<div class="section"><h3>' + (isBuy ? "What would close this" : "What would move this to Buy") +
        '</h3><div class="callout' + (isBuy ? "" : " watch") + '">' +
        esc(p.what_would_change) + '</div></div>' : "",
    ev ? '<div class="section"><h3>Evidence</h3><div class="ev">' + ev + '</div></div>' : "",
    (p.technical && p.technical.not_testable && p.technical.not_testable.length)
      ? '<div class="section"><h3>Checks that could not run</h3>' +
        '<div class="callout watch">' +
        esc(p.technical.not_testable.join("; ")) +
        ' — these did not pass. The data needed to test them is not available, ' +
        'so this name rests on partial evidence.</div></div>' : "",
    lv ? '<div class="section"><h3>Levels the strategy defines</h3>' +
         '<div class="levels">' + lv + '</div>' +
         (p.holding_period ? '<p class="prose muted" style="margin-top:var(--sp-3);font-size:13px">' +
           'Expected holding period ' + esc(p.holding_period) + '.' +
           (p.cost_note ? " " + esc(p.cost_note) : "") + '</p>' : "") +
         '</div>' : "",
    '<div class="section"><h3>Advanced</h3><details class="adv"><summary>' +
      'Model detail, raw factor contributions and research basis</summary>' +
      '<div class="adv-body">' +
        '<div class="readings" style="margin-bottom:var(--sp-3)">' +
          row("Model rank", p.rank) +
          row("Universe percentile", t.percentile) +
          row("Score after risk checks", t.score) +
        '</div>' +
        (t.why_raw && t.why_raw.length
          ? '<div class="raw">' + esc(t.why_raw.join("\n")) + '</div>' : "") +
        (t.against_raw && t.against_raw.length
          ? '<div class="raw" style="margin-top:8px">' + esc(t.against_raw.join("\n")) + '</div>' : "") +
        (t.warning ? '<p class="prose muted" style="margin-top:var(--sp-3);font-size:12.5px">' +
          esc(t.warning) + '</p>' : "") +
      '</div></details></div>',
  ].join("");
}

/* ------------------------------------------------------------------ wire */
function wire() {
  $$(".card").forEach((el) => el.addEventListener("click", () => {
    const p = (state.view.picks || []).find((x) => String(x.position) === el.dataset.pos);
    if (p) openPanel(p);
  }));
  $$("tbody tr[data-date]").forEach((el) =>
    el.addEventListener("click", () => openDay(el.dataset.date)));
  // The name sits inside the row, so its click has to stop there or opening a
  // name would also open the day behind it.
  $$("button[data-stock]").forEach((el) => el.addEventListener("click", (e) => {
    e.stopPropagation();
    openStock(el.dataset.stock);
  }));
  const wipe = $("#wipe");
  if (wipe) wipe.addEventListener("click", confirmWipe);
}

$("#scan").addEventListener("click", scan);
$("#panel-close").addEventListener("click", closePanel);
$("#scrim").addEventListener("click", closePanel);
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && $("#panel").classList.contains("open")) closePanel();
});
$$(".nav button").forEach((b) => b.addEventListener("click", () => {
  state.tab = b.dataset.view;
  render();
  if (state.tab === "history" && state.history === undefined) loadHistory();
}));

async function loadHistory() {
  state.history = null;                 // renders the skeleton
  if (state.tab === "history") render();
  try {
    const r = await fetch("/history?limit=30");
    state.history = r.ok ? await r.json() : { days: [], note: "The run history could not be read." };
  } catch (e) {
    state.history = { days: [], note: "The run history could not be read." };
  }
  if (state.tab === "history") render();
}

/* Recover the most recent completed scan so a reload does not look like a
   product that forgets. */
(async function boot() {
  render();
  try {
    await checkReady();
    if (state.notReady) { render(); return; }
    const r = await fetch("/analysis");
    if (!r.ok) return;
    const { jobs } = await r.json();
    const done = (jobs || []).find((j) => j.kind === "analysis" && j.state === "COMPLETED");
    if (!done) return;
    const vr = await fetch("/analysis/" + done.id + "/view");
    if (!vr.ok) return;
    state.view = await vr.json();
    state.run = done.id;
    render();
  } catch (e) {}
})();
</script>
